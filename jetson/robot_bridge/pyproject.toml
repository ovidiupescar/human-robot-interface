[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "robot_bridge"
version = "0.1.0"
description = "Python helper library for robot skills — wraps ROS2 (rclpy) calls behind a clean API"
authors = [{ name = "Ovidiu Pescar", email = "ovidiu@artoriuslabs.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    # rclpy is provided by the system ROS2 install, not pip
]

[tool.setuptools.packages.find]
where = ["."]
include = ["robot_bridge*"]
