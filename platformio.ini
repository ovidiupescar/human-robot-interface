; Waveshare ESP32-S3 Touch AMOLED 1.75"
; - ESP32-S3R8 (8MB PSRAM, 16MB Flash)
; - 466x466 AMOLED, CO5300 driver, QSPI
; - CST9217 touch, QMI8658 IMU, AXP2101 PMIC, PCF85063 RTC

[env:waveshare-s3-amoled-175]
; pioarduino fork -> Arduino-ESP32 v3.x (required by Arduino_GFX 1.4.7)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    moononournation/GFX Library for Arduino@^1.4.7
    adafruit/Adafruit NeoPixel@^1.12.3

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    ; Note: loop stack override removed to avoid sdkconfig.h redefinition warning
    ; Default 8192 is sufficient for now
